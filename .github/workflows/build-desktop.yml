# Compila o Meshtastic Desktop a partir do codigo OFICIAL, sem alteracoes.
# Referencia: job `release-desktop` de meshtastic/Meshtastic-Android/.github/workflows/release.yml
# (conferido na tag v2.8.4). Diferencas: sem assinatura, sem Linux ARM, sem uber jar e sem atestado.
name: Compilar Meshtastic Desktop

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag oficial a compilar (ex.: v2.8.4). Nunca usar tags -internal.N'
        required: true
        type: string
      version_name:
        description: 'Versao sem o v (ex.: 2.8.4)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Conferir tag e versao
        env:
          TAG: ${{ inputs.tag_name }}
          VERSION: ${{ inputs.version_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A tag precisa ser de producao (ex.: v2.8.4). Recebido: $TAG"; exit 1
          fi
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::version_name ($VERSION) nao corresponde a tag ($TAG)"; exit 1
          fi

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      # O nome deste repositorio deixa o caminho da pasta de trabalho mais longo que o do
      # oficial, e alguns arquivos de teste passam do limite de 260 caracteres do Windows.
      - name: Liberar caminhos longos no git (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      # Baixa o codigo OFICIAL na tag, sem alteracoes
      - name: Checkout do codigo oficial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meshtastic/Meshtastic-Android
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Registrar commit compilado
        shell: bash
        run: echo "Compilando meshtastic/Meshtastic-Android@$(git rev-parse HEAD) (${{ inputs.tag_name }})" | tee -a "$GITHUB_STEP_SUMMARY"

      # Action composta do proprio projeto: instala Temurin 25 + JBR 25 e o Gradle.
      # Sem secrets de Develocity: o build scan nao e publicado e o cache remoto fica so leitura.
      - name: Gradle Setup
        uses: ./.github/actions/gradle-setup
        with:
          cache_read_only: 'false'

      - name: Dependencias do AppImage
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64

      # Aspas simples nas flags -P por causa do PowerShell no Windows.
      # No Windows, --no-isolated-projects --no-configuration-cache sao obrigatorias (WiX).
      - name: Empacotar
        env:
          ORG_GRADLE_PROJECT_appVersionName: ${{ inputs.version_name }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          SIGN_MACOS: 'false'
        run: >
          ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS
          '-PaboutLibraries.release=true' '-Pdesktop.release=true' --no-daemon
          ${{ runner.os == 'Windows' && '--no-isolated-projects --no-configuration-cache' || '' }}

      # UPDATE_RELEASE_TAG fica de fora de proposito: sem ele o AppImage nao embute
      # auto-atualizacao apontando para outro repositorio.
      - name: Montar AppImage
        if: runner.os == 'Linux'
        env:
          APP_VERSION_NAME: ${{ inputs.version_name }}
        run: scripts/build-appimage.sh

      - name: Listar binarios
        shell: bash
        run: ls -R desktopApp/build/compose/binaries/main-release

      - name: Enviar artefatos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            desktopApp/build/compose/binaries/main-release/*/*.dmg
            desktopApp/build/compose/binaries/main-release/*/*.msi
            desktopApp/build/compose/binaries/main-release/*/*.exe
            desktopApp/build/compose/binaries/main-release/*/*.deb
            desktopApp/build/compose/binaries/main-release/*/*.rpm
            desktopApp/build/compose/binaries/main-release/*/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Os artefatos chegam em subpastas (dmg/, msi/, ...): trazer tudo para dist/
      - name: Conferir os 6 formatos
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          # O GitHub troca espacos por pontos no nome dos anexos; renomear antes
          # para o SHA256SUMS.txt bater com os nomes publicados.
          for f in dist/*\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          ls -la dist
          for ext in dmg msi exe deb rpm AppImage; do
            ls dist/*."$ext" >/dev/null 2>&1 || { echo "::error::Faltou o .$ext"; exit 1; }
          done

      - name: Gerar SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: desktop-${{ inputs.tag_name }}
          VERSION: ${{ inputs.version_name }}
          SRC_TAG: ${{ inputs.tag_name }}
        run: |
          notes="Compilacao nao oficial, sem alteracoes, do codigo em https://github.com/meshtastic/Meshtastic-Android/tree/${SRC_TAG} (licenca GPL-3.0). Instaladores sem assinatura digital. Codigo-fonte correspondente: https://github.com/meshtastic/Meshtastic-Android/archive/refs/tags/${SRC_TAG}.tar.gz"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --target "${GITHUB_SHA}" \
              --title "Meshtastic Desktop ${VERSION}" --notes "$notes"
          fi

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
